<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSA Vocabulary 13–24</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#17171f}header{background:#181824;color:white;padding:22px;border-bottom:6px solid #7657e8}main{max-width:1050px;margin:auto;padding:18px}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.mode{cursor:pointer;border:2px solid #ddd;border-radius:14px;padding:16px;background:white;text-align:left;font:inherit}.mode:hover{border-color:#7657e8}.primary{background:#7657e8;color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:bold}.secondary{background:white;border:1px solid #aaa;border-radius:10px;padding:11px 16px}.option{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:1px solid #bbb;border-radius:10px;background:white;font:inherit;cursor:pointer}.good{border-color:#087f5b!important;background:#e6fcf5!important}.bad{border-color:#c92a2a!important;background:#fff5f5!important}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}input{font:inherit;padding:11px;border:1px solid #aaa;border-radius:8px;width:100%;box-sizing:border-box}.hidden{display:none}.progress{height:12px;background:#e9ecef;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#7657e8}.score{font-size:24px;font-weight:800}.muted{color:#666}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;margin:3px}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;padding:9px;text-align:left}th{background:#f1f3f5}@media print{header,.no-print,#menu,#setup{display:none!important}}
</style></head><body><header><h1>BSA Vocabulary 13–24: Mastery Arcade</h1><p>12 new words • practice • instant feedback • progress tracking</p></header><main>
<section id="setup" class="card"><h2>Student Check-In</h2><div class="row"><label>Name<input id="student" placeholder="First and last name"></label><label>Class / Period<input id="className" placeholder="Class or period"></label></div><p class="muted">Progress is saved in this browser. Export Results when finished.</p></section>
<section id="menu" class="card"><h2>Choose Your Challenge</h2><div class="grid">
<button class="mode" onclick="start('definition')"><b>1. Definition Detective</b><br><span class="muted">Match words to meanings.</span></button>
<button class="mode" onclick="start('synonym')"><b>2. Synonym Search</b><br><span class="muted">Find the closest meaning.</span></button>
<button class="mode" onclick="start('antonym')"><b>3. Antonym Attack</b><br><span class="muted">Find the opposite meaning.</span></button>
<button class="mode" onclick="start('context')"><b>4. Context Clue Quest</b><br><span class="muted">Use the sentence to choose the word.</span></button>
<button class="mode" onclick="start('spelling')"><b>5. Spell It!</b><br><span class="muted">Type the word from its definition.</span></button>
<button class="mode" onclick="start('partofspeech')"><b>6. Word Class Challenge</b><br><span class="muted">Identify noun, verb, or adjective.</span></button>
<button class="mode" onclick="start('mixed')"><b>7. 24-Question Mastery</b><br><span class="muted">Randomized mixed review.</span></button></div>
<div class="row no-print" style="margin-top:14px"><button class="secondary" onclick="showReport()">View Progress</button><button class="secondary" onclick="exportCSV()">Export Results (.csv)</button><button class="secondary" onclick="resetAll()">Reset This Device</button></div></section>
<section id="game" class="card hidden"></section><section id="report" class="card hidden"></section></main>
<script>
const WORDS=[{"word": "ornate", "pos": "adjective", "definition": "having a lot of fancy decorations or details; excessively embellished", "syn": ["decorated", "adorned", "fancy", "elaborate", "embellished"], "ant": ["dull", "plain", "simple", "unadorned"], "context": "The theater's _____ ceiling was covered with elaborate patterns and gold details."}, {"word": "confiscate", "pos": "verb", "definition": "to take away, usually because it is against the rules or for safety reasons", "syn": ["seize", "take", "appropriate", "impound"], "ant": ["return", "release", "give back"], "context": "The teacher had to _____ the phone because it was being used during the test."}, {"word": "languid", "pos": "adjective", "definition": "displaying or having a lack of energy or effort; slow and relaxed", "syn": ["weak", "tired", "exhausted", "sluggish", "lethargic"], "ant": ["energetic", "active", "lively", "vigorous"], "context": "After the long hike, the students took a _____ walk back to the bus."}, {"word": "innovation", "pos": "noun", "definition": "a new idea, method, or device", "syn": ["invention", "creation", "new idea", "breakthrough"], "ant": ["failure", "inefficiency", "old method"], "context": "The new solar-powered backpack was an exciting _____ in outdoor technology."}, {"word": "lofty", "pos": "adjective", "definition": "elevated in status, character, or spirit; high or grand", "syn": ["grand", "towering", "elevated", "exalted"], "ant": ["modest", "low", "short", "below"], "context": "The team set a _____ goal of improving its community before the end of the year."}, {"word": "paradox", "pos": "noun", "definition": "a statement or idea that seems to go against common sense but may be true", "syn": ["contradiction", "puzzle", "oddity", "mystery"], "ant": ["certainty", "consistency", "agreement"], "context": "It seems like a _____ that the more choices people have, the harder it can be to choose."}, {"word": "implicit", "pos": "adjective", "definition": "implied, though not directly expressed or stated", "syn": ["implied", "unspoken", "unstated", "unvoiced"], "ant": ["spoken", "stated", "explicit", "direct"], "context": "Although no one said it aloud, there was an _____ expectation that everyone would help clean up."}, {"word": "marvel", "pos": "verb", "definition": "to become filled with surprise, wonder, or amazed curiosity", "syn": ["gape", "stare", "gaze", "gawk"], "ant": ["ignore", "disregard", "overlook"], "context": "Visitors stopped to _____ at the enormous waterfall."}, {"word": "hoist", "pos": "verb", "definition": "to lift or raise, often by use of ropes or pulleys", "syn": ["raise", "lift", "elevate", "haul"], "ant": ["lower", "drop", "sink"], "context": "The workers used a crane to _____ the heavy equipment onto the roof."}, {"word": "optimistic", "pos": "adjective", "definition": "feeling or showing hope for the future", "syn": ["confident", "hopeful", "positive", "encouraged"], "ant": ["doubtful", "hopeless", "pessimistic", "negative"], "context": "Even after the difficult practice, the coach remained _____ about the team's chances."}, {"word": "loathe", "pos": "verb", "definition": "to feel strong hate, dislike, or disgust for someone or something", "syn": ["despise", "detest", "hate", "abhor"], "ant": ["enjoy", "prefer", "cherish", "love"], "context": "I _____ waiting in extremely long lines, especially when I am in a hurry."}, {"word": "burrow", "pos": "verb", "definition": "to make a hole or tunnel, typically for use as a dwelling", "syn": ["dig", "tunnel", "excavate", "bore"], "ant": ["fill", "cover", "bury", "seal"], "context": "The rabbit began to _____ under the fence to reach the garden."}],KEY='bsa_vocab_13_24_results_v1';let state={mode:'',items:[],i:0,correct:0,answers:[],locked:false};
const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function save(){localStorage.setItem('v13name',$('student').value);localStorage.setItem('v13class',$('className').value)}
$('student').value=localStorage.getItem('v13name')||'';$('className').value=localStorage.getItem('v13class')||'';$('student').oninput=save;$('className').oninput=save;
function label(m){return({definition:'Definition Detective',synonym:'Synonym Search',antonym:'Antonym Attack',context:'Context Clue Quest',spelling:'Spell It!',partofspeech:'Word Class Challenge',mixed:'24-Question Mastery'})[m]}
function start(mode){if(!$('student').value.trim()){alert('Please enter your name first.');return}save();state={mode,items:make(mode),i:0,correct:0,answers:[],locked:false};$('menu').classList.add('hidden');$('setup').classList.add('hidden');$('report').classList.add('hidden');$('game').classList.remove('hidden');render()}
function make(mode){if(mode==='definition')return shuffle(WORDS).map(w=>({type:'definition',w}));if(mode==='synonym')return shuffle(WORDS).map(w=>({type:'synonym',w}));if(mode==='antonym')return shuffle(WORDS).map(w=>({type:'antonym',w}));if(mode==='context')return shuffle(WORDS).map(w=>({type:'context',w}));if(mode==='spelling')return shuffle(WORDS).map(w=>({type:'spelling',w}));if(mode==='partofspeech')return shuffle(WORDS).map(w=>({type:'partofspeech',w}));let p=[];WORDS.forEach(w=>['definition','synonym','antonym','context','spelling','partofspeech'].forEach(type=>p.push({type,w})));return shuffle(p).slice(0,24)}
function choices(it){let w=it.w;if(it.type==='definition')return shuffle([w.definition,...shuffle(WORDS.filter(x=>x.word!==w.word)).slice(0,3).map(x=>x.definition)]);if(it.type==='synonym')return shuffle([w.syn[0],...shuffle(WORDS.filter(x=>x.word!==w.word).flatMap(x=>x.syn)).slice(0,3)]);if(it.type==='antonym')return shuffle([w.ant[0],...shuffle(WORDS.filter(x=>x.word!==w.word).flatMap(x=>x.ant)).slice(0,3)]);if(it.type==='context')return shuffle([w.word,...shuffle(WORDS.filter(x=>x.word!==w.word)).slice(0,3).map(x=>x.word)]);return shuffle([w.pos,...['noun','verb','adjective'].filter(x=>x!==w.pos)])}
function prompt(it){let w=it.w;if(it.type==='definition')return`Which definition matches <b>${w.word}</b>?`;if(it.type==='synonym')return`Which word is a synonym for <b>${w.word}</b>?`;if(it.type==='antonym')return`Which word is an antonym for <b>${w.word}</b>?`;if(it.type==='context')return w.context.replace('_____','<b>_____</b>');if(it.type==='partofspeech')return`What part of speech is <b>${w.word}</b>?`;return`Spell the word that means:<br><b>${w.definition}</b>`}
function key(it){if(it.type==='definition')return it.w.definition;if(it.type==='synonym')return it.w.syn[0];if(it.type==='antonym')return it.w.ant[0];if(it.type==='context')return it.w.word;if(it.type==='partofspeech')return it.w.pos;return it.w.word}
function render(){let it=state.items[state.i],pct=Math.round(state.i/state.items.length*100),h=`<div class="row"><b>${label(state.mode)}</b><span style="text-align:right">Question ${state.i+1} of ${state.items.length}</span></div><div class="progress"><div style="width:${pct}%"></div></div><h2>${prompt(it)}</h2>`;if(it.type==='spelling')h+=`<input id="spell" placeholder="Type your answer"><button class="primary" style="margin-top:10px" onclick="submitSpell()">Check Answer</button>`;else{h+='<div id="choices">';choices(it).forEach(c=>h+=`<button class="option" onclick='answer(this,${JSON.stringify(c)})'>${c}</button>`);h+='</div>'}h+=`<div id="feedback"></div><div class="no-print" style="margin-top:14px"><button class="secondary" onclick="quit()">Back to Menu</button></div>`;$('game').innerHTML=h;if(it.type==='spelling')setTimeout(()=>$('spell').focus(),50)}
function answer(btn,val){if(state.locked)return;state.locked=true;let it=state.items[state.i],ans=key(it),ok=val.toLowerCase()===ans.toLowerCase();btn.classList.add(ok?'good':'bad');finish(ok,val,ans,it)}
function submitSpell(){if(state.locked)return;let el=$('spell'),val=el.value.trim();if(!val)return;state.locked=true;let it=state.items[state.i],ans=it.w.word,ok=val.toLowerCase()===ans.toLowerCase();el.classList.add(ok?'good':'bad');finish(ok,val,ans,it)}
function finish(ok,val,ans,it){if(ok)state.correct++;state.answers.push({word:it.w.word,type:it.type,response:val,answer:ans,correct:ok});$('feedback').innerHTML=`<p class="${ok?'good':'bad'}" style="padding:10px;border-radius:8px"><b>${ok?'Correct!':'Not quite.'}</b> ${ok?'':`Correct answer: <b>${ans}</b>.`}<br><span class="muted">${it.w.word}: ${it.w.definition}</span></p><button class="primary" onclick="next()">Next</button>`}
function next(){state.i++;state.locked=false;if(state.i>=state.items.length)complete();else render()}
function complete(){let pct=Math.round(state.correct/state.items.length*100),rec={date:new Date().toLocaleString(),name:$('student').value.trim(),className:$('className').value.trim(),mode:label(state.mode),score:state.correct,total:state.items.length,pct,answers:state.answers};let all=JSON.parse(localStorage.getItem(KEY)||'[]');all.push(rec);localStorage.setItem(KEY,JSON.stringify(all));$('game').innerHTML=`<h2>Challenge Complete!</h2><p class="score">${state.correct}/${state.items.length} = ${pct}%</p><p>${pct>=80?'Keep building that mastery!':'Review the missed words and try again.'}</p><div class="row no-print"><button class="primary" onclick="showReport()">View / Export Results</button><button class="secondary" onclick="quit()">Choose Another Challenge</button></div>`}
function quit(){$('game').classList.add('hidden');$('report').classList.add('hidden');$('setup').classList.remove('hidden');$('menu').classList.remove('hidden')}
function showReport(){$('setup').classList.add('hidden');$('menu').classList.add('hidden');$('game').classList.add('hidden');$('report').classList.remove('hidden');let all=JSON.parse(localStorage.getItem(KEY)||'[]'),rows=all.map(r=>`<tr><td>${r.date}</td><td>${r.mode}</td><td>${r.score}/${r.total}</td><td>${r.pct}%</td></tr>`).join(''),latest=all[all.length-1],misses=latest?latest.answers.filter(a=>!a.correct):[];$('report').innerHTML=`<h2>Vocabulary Progress Report</h2><p><b>Student:</b> ${$('student').value||'—'} &nbsp; <b>Class:</b> ${$('className').value||'—'}</p><table><thead><tr><th>Date</th><th>Activity</th><th>Score</th><th>Percent</th></tr></thead><tbody>${rows||'<tr><td colspan="4">No completed activities yet.</td></tr>'}</tbody></table>${latest?`<h3>Most Recent Missed Words</h3>${misses.length?misses.map(x=>`<span class="pill">${x.word}</span>`).join(''):'<p>None — perfect score!</p>'}`:''}<div class="row no-print" style="margin-top:16px"><button class="primary" onclick="exportCSV()">Export Results (.csv)</button><button class="secondary" onclick="window.print()">Print / Save as PDF</button><button class="secondary" onclick="quit()">Back</button></div>`}
function csvSafe(s){return'"'+String(s??'').replaceAll('"','""')+'"'}function exportCSV(){let all=JSON.parse(localStorage.getItem(KEY)||'[]');if(!all.length){alert('Complete an activity first.');return}let lines=[['Student','Class','Date','Activity','Score','Total','Percent','Missed Words'].map(csvSafe).join(',')];all.forEach(r=>lines.push([r.name,r.className,r.date,r.mode,r.score,r.total,r.pct,r.answers.filter(a=>!a.correct).map(a=>a.word).join('; ')].map(csvSafe).join(',')));let b=new Blob([lines.join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='BSA_Vocab_13-24_Results.csv';a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm('Erase all saved scores on this browser?')){localStorage.removeItem(KEY);alert('Saved scores erased.')}}
</script></body></html>
